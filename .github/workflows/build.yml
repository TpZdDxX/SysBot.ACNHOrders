name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test SysBot.ACNHOrders.sln -c Release
      - run: dotnet publish SysBot.ACNHOrders.csproj -c Release -f net10.0 -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o out
      - uses: actions/upload-artifact@v7
        with:
          path: out/SysBot.ACNHOrders.exe
          archive: false
