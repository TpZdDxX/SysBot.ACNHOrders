name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish SysBot.ACNHOrders.csproj -c Release -f net10.0 -r win-x64 --self-contained -p:PublishSingleFile=true -o out
      - uses: actions/upload-artifact@v4
        with:
          name: SysBot.ACNHOrders-win-x64
          path: out
